name: Test Project
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - .github/workflows/*
jobs:
  test:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Install Dependencies
        run: npm ci
      - name: Run Tests
        run: npm test
  build:
    needs: test
    runs-on: ubuntu-slim
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Install Dependencies
        run: npm ci
      - name: Build Project
        run: npm run build
  deploy:
    needs: build
    runs-on: ubuntu-slim
    steps:
      - name: Deploy
        run: echo 'Deploying...'